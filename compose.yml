# podman compose up -d                (or docker compose; the file is the same)
# podman compose pull && … up -d      to move to a newer release
#
# This file is the whole deployment: it names a published image, so it works on
# its own with no clone, no toolchain, and nothing to compile. `up` reuses the
# image it already has, which is why an upgrade is a `pull` first.
#
# Building from source instead? `podman build -t ghcr.io/fosslife/drive:latest .`
# and this file runs that build rather than pulling — the tag is the only thing
# either path agrees on. `down -v` is never the way to pick up a new build: it
# destroys the data volume, meaning your files and your accounts.
#
# One service, one volume, one port. If a second service ever appears here,
# something has gone wrong with the architecture rather than with this file.
services:
  drive:
    image: ghcr.io/fosslife/drive:latest
    ports:
      - "${DRIVE_PUBLISH:-8080:8080}"
    volumes:
      - ./data:/data
    # Nothing is required: as it stands this serves plaintext on 8080, which is
    # what you want behind a proxy that terminates TLS, or on a Tailscale
    # address, or while trying the thing out. Facing the public internet
    # directly instead? Set DRIVE_HOSTNAME and certificates become automatic.
    #
    # Settings go in .env — copy .env.example, uncomment, `up -d` again. The
    # file is optional and every value it can hold is already defaulted, so
    # there is nothing to write until you want something changed.
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
