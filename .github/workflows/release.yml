# Push a tag, get binaries. The build itself is scripts/release.sh — the same
# one used locally, so a release is never a second, divergent build recipe.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write    # to sign the provenance attestations
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: go vet ./... && go test ./...
      - run: npm --prefix web ci
      - run: npm --prefix web test
      - run: npm --prefix web run build # embedded by web/embed.go; SKIP_WEB below is why

      - run: VERSION=${GITHUB_REF_NAME} SKIP_WEB=1 scripts/release.sh
      - run: sha256sum drive-linux-* > SHA256SUMS
        working-directory: dist

      # Provenance: a signed record that this exact file came out of this exact
      # workflow, which is what lets somebody who did not build it run
      # `gh attest verify` instead of trusting the download. Binaries here, the
      # image below; both are checked the same way. See docs/verify.md.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/drive-linux-*

      - run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/*
        env:
          GH_TOKEN: ${{ github.token }}

      # The image, from the same Dockerfile anyone can build locally. Published
      # so that deploying is a compose file and nothing else — no clone, no
      # toolchain, no binary to place. The two architectures are one buildx
      # invocation because the Dockerfile cross-compiles; see the note in it.
      #
      # docker-container is the driver that can emit a multi-architecture
      # manifest at all: the default one builds for the runner and stops.
      - run: docker buildx create --use
      - run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ github.token }}
      # --provenance/--sbom put the build's own record and its bill of materials
      # in the registry beside the image; the attestation step after this signs
      # the digest with GitHub's identity, which is the part `gh attest verify`
      # checks. The source label is what links the package to this repository,
      # so the package page shows the README instead of nothing.
      - id: push
        run: |
          docker buildx build --push \
            --platform linux/amd64,linux/arm64 \
            --provenance=mode=max --sbom=true \
            --build-arg VERSION="$GITHUB_REF_NAME" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --metadata-file /tmp/build.json \
            -t "ghcr.io/$GITHUB_REPOSITORY:$GITHUB_REF_NAME" \
            -t "ghcr.io/$GITHUB_REPOSITORY:latest" .
          jq -r '"digest=" + ."containerimage.digest"' /tmp/build.json >> "$GITHUB_OUTPUT"

      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
