# Push a tag, get binaries. The build itself is scripts/release.sh — the same
# one used locally, so a release is never a second, divergent build recipe.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: go vet ./... && go test ./...
      - run: npm --prefix web ci
      - run: npm --prefix web test
      - run: npm --prefix web run build # embedded by web/embed.go; SKIP_WEB below is why

      - run: VERSION=${GITHUB_REF_NAME} SKIP_WEB=1 scripts/release.sh
      - run: sha256sum drive-linux-* > SHA256SUMS
        working-directory: dist

      - run: gh release create "$GITHUB_REF_NAME" --generate-notes dist/*
        env:
          GH_TOKEN: ${{ github.token }}

      # The image, from the same Dockerfile anyone can build locally. Published
      # so that deploying is a compose file and nothing else — no clone, no
      # toolchain, no binary to place. The two architectures are one buildx
      # invocation because the Dockerfile cross-compiles; see the note in it.
      #
      # docker-container is the driver that can emit a multi-architecture
      # manifest at all: the default one builds for the runner and stops.
      - run: docker buildx create --use
      - run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          docker buildx build --push \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$GITHUB_REF_NAME" \
            -t "ghcr.io/$GITHUB_REPOSITORY:$GITHUB_REF_NAME" \
            -t "ghcr.io/$GITHUB_REPOSITORY:latest" .
